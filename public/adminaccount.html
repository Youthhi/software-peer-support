<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-cyan-300 via-blue-400 to-indigo-600">

    <div class="max-w-6xl mx-auto flex py-10 px-4 gap-8">

        <!-- SIDEBAR -->
        <aside class="w-1/4 bg-white rounded-xl shadow p-6 h-fit">
            <div class="flex items-center gap-4 mb-6">
                <a href="mainpage" class="p-2 hover:bg-gray-100 rounded-full transition-colors group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600 group-hover:text-blue-600"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <h2 class="text-2xl font-bold text-gray-800">Main Page</h2>
            </div>

            <h3 class="font-bold text-xl mb-6">Admin Settings</h3>
            <nav class="space-y-4">
                <button onclick="showSection('personal')"
                    class="w-full text-left p-2 hover:bg-blue-50 rounded text-blue-600 font-medium border-l-4 border-blue-600">👤
                    Edit Personal Details</button>
                <button onclick="showSection('security')"
                    class="w-full text-left p-2 hover:bg-gray-50 rounded text-gray-600">🔒 Privacy & Security</button>
                <button onclick="showSection('alerts')"
                    class="w-full text-left p-2 hover:bg-gray-50 rounded text-gray-600">👥 Alerts</button>
                <button onclick="showSection('application')"
                    class="w-full text-left p-2 hover:bg-gray-50 rounded text-gray-600">🛡 Moderator Application
                    Notification</button>
                <button onclick="toggleDarkMode()"
                    class="w-full text-left p-2 hover:bg-gray-50 rounded text-gray-600">🌗 Light/Dark Mode</button>
                <button id="logoutBtn" class="w-full text-left p-2 hover:bg-red-50 rounded text-red-600 mt-10">🚪 Log
                    Out</button>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main id="mainContent" class="w-3/4 bg-white rounded-xl shadow p-8 overflow-auto">

            <!-- PERSONAL DETAILS -->
            <section id="personalSection">
                <h2 class="text-2xl font-bold mb-6">Edit Personal Details</h2>
                <form id="detailsForm" class="grid grid-cols-2 gap-6">

                    <!-- PROFILE IMAGE -->
                    <div class="col-span-2 flex items-center gap-6 pb-6">
                        <div class="relative">
                            <img id="profilePreview" src="https://via.placeholder.com/150"
                                class="w-24 h-24 rounded-full object-cover border-2 border-blue-500">
                            <label for="fileInput"
                                class="absolute bottom-0 right-0 bg-blue-600 text-white p-1 rounded-full cursor-pointer hover:bg-blue-700">📸</label>
                            <input type="file" id="fileInput" class="hidden" accept="image/*">
                        </div>
                        <div>
                            <h4 class="font-bold">Profile Photo</h4>
                            <p class="text-sm text-gray-500">Click the icon to upload a new photo</p>
                        </div>
                    </div>

                    <!-- BIO -->
                    <div class="col-span-2">
                        <label class="block text-sm font-medium mb-1">Bio</label>
                        <textarea id="bio" rows="3" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500"
                            placeholder="Tell us about yourself..."></textarea>
                    </div>

                    <!-- FULL NAME -->
                    <div>
                        <label class="block text-sm font-medium mb-1">Full Name</label>
                        <input type="text" id="fullName" class="w-full border p-2 rounded">
                    </div>

                    <!-- EMAIL -->
                    <div>
                        <label class="block text-sm font-medium mb-1">Email</label>
                        <input type="email" id="email" class="w-full border p-2 rounded bg-gray-100" readonly>
                    </div>

                    <!-- DOB -->
                    <div>
                        <label class="block text-sm font-medium mb-1">Date of Birth</label>
                        <input type="date" id="dob" class="w-full border p-2 rounded">
                    </div>

                    <!-- GENDER -->
                    <div>
                        <label class="block text-sm font-medium mb-1">Gender</label>
                        <select id="gender" class="w-full border p-2 rounded">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- QUALIFICATION -->
                    <div class="col-span-2">
                        <label class="block text-sm font-medium mb-1">Qualification</label>
                        <input type="text" id="qualification" class="w-full border p-2 rounded"
                            placeholder="e.g., Master in Management">
                    </div>

                    <!-- SUBMIT -->
                    <div class="col-span-2 flex items-center gap-4 py-4 border-t">
                        <button type="submit"
                            class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">Submit
                            Changes</button>
                        <p id="confirmMsg" class="text-green-600 font-medium hidden">✅ Update saved!</p>
                    </div>
                </form>
            </section>
            <section id="applicationSection" class="hidden">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Moderator Applications</h2>
                <div class="bg-white border rounded-xl shadow-sm overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="p-4 text-xs font-bold text-gray-500 uppercase">Applicant</th>
                                <th class="p-4 text-xs font-bold text-gray-500 uppercase">Reason</th>
                                <th class="p-4 text-xs font-bold text-gray-500 uppercase text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="applicationTableBody" class="divide-y divide-gray-100">
                        </tbody>
                    </table>
                    <div id="noRequestsMsg" class="p-8 text-center text-gray-500 hidden">
                        No pending moderator applications.
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getFirestore, doc, getDoc, updateDoc, setDoc, deleteDoc,
            collection, getDocs, query, where, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
        /* ===================== CONFIG & INIT ===================== */
        const firebaseConfig = {
            apiKey: "AIzaSyAlpEfar5odDfV9c2bbmaIpAt5fJJfbez4",
            authDomain: "software-peer-support.firebaseapp.com",
            projectId: "software-peer-support",
            storageBucket: "software-peer-support.appspot.com",
            messagingSenderId: "43088815786",
            appId: "1:43088815786:web:4332760b0fef1b7ae152d3"
        };
    
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const uid = sessionStorage.getItem("uid") || localStorage.getItem("uid");
    
        /* ===================== NAVIGATION ===================== */
        window.showSection = (section) => {
            const sections = ['personal', 'security', 'alerts', 'application'];
            sections.forEach(s => {
                const el = document.getElementById(`${s}Section`);
                if (el) el.classList.add('hidden');
            });
    
            const target = document.getElementById(`${section}Section`);
            if (target) target.classList.remove('hidden');
    
            // Update Sidebar UI styling
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('bg-blue-50', 'text-blue-600', 'border-l-4', 'border-blue-600', 'font-medium');
                btn.classList.add('text-gray-600');
            });
    
            if (section === 'application') loadApplications();
        };
    
        /* ===================== ADMIN PROFILE LOGIC ===================== */
        async function loadAdminProfile() {
            if (!uid) {
                alert("Please login as admin.");
                window.location.href = "/register";
                return;
            }
    
            const docSnap = await getDoc(doc(db, "admins", uid));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById("fullName").value = `${data.firstName || ''} ${data.lastName || ''}`;
                document.getElementById("email").value = data.email || "";
                document.getElementById("dob").value = data.dob || "";
                document.getElementById("gender").value = data.gender || "Male";
                document.getElementById("qualification").value = data.qualification || "";
                document.getElementById("bio").value = data.bio || "";
                if (data.profilePic) document.getElementById("profilePreview").src = data.profilePic;
            }
        }
    
        document.getElementById("detailsForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const [firstName, ...lastNameParts] = document.getElementById("fullName").value.split(" ");
    
            try {
                await updateDoc(doc(db, "admins", uid), {
                    firstName,
                    lastName: lastNameParts.join(" "),
                    bio: document.getElementById("bio").value,
                    profilePic: document.getElementById("profilePreview").src,
                    dob: document.getElementById("dob").value,
                    gender: document.getElementById("gender").value,
                    qualification: document.getElementById("qualification").value,
                    updatedAt: serverTimestamp()
                });
    
                const msg = document.getElementById("confirmMsg");
                msg.classList.remove("hidden");
                setTimeout(() => msg.classList.add("hidden"), 2500);
            } catch (err) {
                alert("Error updating profile.");
            }
        });
    
        /* ===================== MODERATOR APPROVAL LOGIC ===================== */
        async function loadApplications() {
            const tbody = document.getElementById("applicationTableBody");
            tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-gray-400 italic">Loading requests...</td></tr>`;
    
            const q = query(collection(db, "moderatorRequests"), where("status", "==", "pending"));
            const snap = await getDocs(q);
    
            tbody.innerHTML = "";
            if (snap.empty) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-gray-400">No pending requests.</td></tr>`;
                return;
            }
    
            snap.forEach(docSnap => {
                const req = docSnap.data();
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-4">
                            <p class="font-bold text-gray-800">${req.fullName}</p>
                            <p class="text-xs text-gray-500">${req.email}</p>
                        </td>
                        <td class="p-4 text-sm text-gray-600 italic">"${req.reason}"</td>
                        <td class="p-4 text-center">
                            <div class="flex gap-2 justify-center">
                                <button onclick="processRequest('${docSnap.id}', '${req.studentUid}', 'approve')" 
                                    class="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold hover:bg-green-700">Approve</button>
                                <button onclick="processRequest('${docSnap.id}', '${req.studentUid}', 'reject')" 
                                    class="bg-red-100 text-red-600 px-3 py-1 rounded text-xs font-bold hover:bg-red-200">Reject</button>
                            </div>
                        </td>
                    </tr>`;
            });
        }
    
        
    
        window.processRequest = async (requestId, studentUid, action) => {
            try {
                if (action === 'approve') {
                    // 1. Fetch current data from 'students'
                    const studentRef = doc(db, "students", studentUid);
                    const studentSnap = await getDoc(studentRef);
    
                    if (studentSnap.exists()) {
                        const studentData = studentSnap.data();
    
                        // 2. Transfer data to 'moderators' collection
                        await setDoc(doc(db, "moderators", studentUid), {
                            ...studentData,
                            role: "moderator",
                            promotedAt: serverTimestamp()
                        });
    
                        // 3. Delete the old record from 'students'
                        await deleteDoc(studentRef);
                        alert("User successfully moved to Moderators collection.");
                    } else {
                        alert("User data not found in students collection.");
                    }
                }
    
                // 4. Remove the request from the queue regardless of approve/reject
                await deleteDoc(doc(db, "moderatorRequests", requestId));
                loadApplications(); 
            } catch (err) {
                console.error("Process Error:", err);
                alert("Operation failed. See console for details.");
            }
        };
    
        /* ===================== UTILS ===================== */
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = event => document.getElementById('profilePreview').src = event.target.result;
                reader.readAsDataURL(file);
            }
        });
    
        document.getElementById("logoutBtn").onclick = () => {
            sessionStorage.clear();
            localStorage.clear();
            window.location.href = "/register";
        };
    
        loadAdminProfile();
    </script>

</body>

</html>
