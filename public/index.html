    <script defer src="/__/firebase/12.7.0/firebase-app-compat.js"></script>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- Login Card -->
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">

        <h2 class="text-2xl font-bold text-center mb-6">
            Login
        </h2>

        <!-- Email -->
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Email</label>
            <input id="email" type="email" placeholder="Enter your email"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Password -->
        <div class="mb-6">
            <label class="block text-gray-700 mb-2">Password</label>
            <input id="password" type="password" placeholder="Enter your password"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Login Button -->
        <button onclick="loginUser('student')"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 mb-2">
            Login as User
        </button>


        <button onclick="loginUser('counsellor')"
            class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">
            Login as Counsellor
        </button>


        <!-- Extra -->
        <p class="text-center text-sm text-gray-500 mt-4">
            Don’t have an account?
            <a href="/register" class="text-blue-600 hover:underline font-medium">Sign up</a>
        </p>
        
        <p class="text-center text-sm text-gray-500 mt-2">
            Access moderator tools? 
            <a href="moderatorlogin.html" class="text-purple-600 hover:underline font-medium">Moderator Portal</a>
        </p>
        
        <p class="text-center text-sm text-gray-500 mt-2">
            Log in as admin?
            <a href="adminlogin.html" class="text-blue-600 hover:underline font-medium">Admin</a>
        </p>


        <p id="message" class="text-center text-sm mt-3"></p>

    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
        const firebaseConfig = {
            apiKey: "AIzaSyAlpEfar5odDfV9c2bbmaIpAt5fJJfbez4",
            authDomain: "software-peer-support.firebaseapp.com",
            projectId: "software-peer-support",
            storageBucket: "software-peer-support.firebasestorage.app",
            messagingSenderId: "43088815786",
            appId: "1:43088815786:web:4332760b0fef1b7ae152d3"
        };
    
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
    
        window.loginUser = async function (role) {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");
    
            if (!email || !password) {
                message.textContent = "Please fill in all fields.";
                message.className = "text-red-500 text-center text-sm mt-3";
                return;
            }
    
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;
    
                // 🔍 DYNAMIC ROLE CHECK
                let collectionName;
                if (role === "student") {
                    collectionName = "students";
                } else if (role === "moderator") {
                    collectionName = "moderators";
                } else {
                    collectionName = "counsellors";
                }
    
                const docRef = doc(db, collectionName, uid);
                const docSnap = await getDoc(docRef);
    
                // IF USER RECORD DOESN'T EXIST IN CHOSEN ROLE COLLECTION
                if (!docSnap.exists()) {
                    await signOut(auth); // Log them out immediately
                    message.textContent = `Access denied. You are not registered in the ${role} portal.`;
                    message.className = "text-red-500 text-center text-sm mt-3";
                    return;
                }

    // ✅ FIXED: Use docSnap instead of studentSnap
    const userData = docSnap.data();
    
    // Support different name formats for different roles
    const fullName = userData.name || userData.adminName || `${userData.firstName || ""} ${userData.lastName || ""}`.trim();

    // SAVE SESSION & REDIRECT
    sessionStorage.setItem("userName", fullName || "User");
                sessionStorage.setItem("uid", uid);
                sessionStorage.setItem("role", role);
                localStorage.setItem("uid", uid);
                localStorage.setItem("role", role);
    
                message.textContent = `Login successful as ${role}! Redirecting...`;
                message.className = "text-green-600 text-center text-sm mt-3";
 
                setTimeout(() => {
            window.location.href = "mainpage.html";
    }, 1500);

                // setTimeout(() => {
                //     // You can customize the redirect based on role if needed
                //     window.location.href = "/mainpage"; 
                // }, 1500);
    
            } catch (error) {
                console.error(error);
                message.textContent = "Invalid email or password.";
                message.className = "text-red-500 text-center text-sm mt-3";
            }
        };
    
        // Helper to navigate to your specific moderator page
        window.goToModeratorLogin = () => {
            window.location.href = "moderator-login.html";
        };
    </script>
