<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderator Portal | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-purple-500 to-indigo-800 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">

        <div class="text-center mb-8">
            <div class="inline-block p-3 bg-purple-100 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-800">Moderator Login</h2>
            <p class="text-gray-500 mt-2">Access your moderation tools</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input id="email" type="email" placeholder="mod@mmu.edu.my" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input id="password" type="password" placeholder="••••••••" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none transition-all">
            </div>

            <button type="submit"
                class="w-full bg-purple-600 text-white font-bold py-3 rounded-lg hover:bg-purple-700 transition-colors shadow-lg">
                Sign In to Dashboard
            </button>
        </form>

        <div class="mt-8 pt-6 border-t text-center">
            <p id="message" class="text-sm font-medium h-5"></p>
            <a href="login.html" class="text-gray-500 hover:text-purple-600 text-sm inline-block mt-4 transition-colors">
                ← Back to Main Login
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlpEfar5odDfV9c2bbmaIpAt5fJJfbez4",
            authDomain: "software-peer-support.firebaseapp.com",
            projectId: "software-peer-support",
            storageBucket: "software-peer-support.firebasestorage.app",
            messagingSenderId: "43088815786",
            appId: "1:43088815786:web:4332760b0fef1b7ae152d3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                // 1. Authenticate with Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                // 2. 🔍 Verify existence in the 'moderators' collection
                const modRef = doc(db, "moderators", uid);
                const modSnap = await getDoc(modRef);

                if (!modSnap.exists()) {
                    // If they are not in the moderators collection, kick them out
                    await auth.signOut();
                    message.textContent = "Access denied: Account is not in Moderator collection.";
                    message.className = "text-red-500 text-sm";
                    return;
                }

                // 3. Save session data
                sessionStorage.setItem("uid", uid);
                sessionStorage.setItem("role", "moderator");
                localStorage.setItem("uid", uid);
                localStorage.setItem("role", "moderator");

                // ✅ SUCCESS
                message.textContent = "Welcome back, Moderator!";
                message.className = "text-green-600 text-sm";

                setTimeout(() => {
                    window.location.href = "/mainpage"; 
                }, 1200);

            } catch (error) {
                console.error(error);
                message.textContent = "Invalid credentials. Please try again.";
                message.className = "text-red-500 text-sm";
            }
        });
    </script>
</body>
</html>
