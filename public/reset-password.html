    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">New Password</h2>
            <p class="text-gray-500 mt-2">Please enter your new secure password below.</p>
        </div>

        <div class="space-y-4">
            <div>
        <label class="block text-sm font-medium text-gray-700">Enter 6-Digit OTP</label>
        <input type="text" id="otpInput" maxlength="6" placeholder="000000" 
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none text-center text-2xl tracking-widest font-bold">
    </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">New Password</label>
                <input id="newPassword" type="password" placeholder="••••••••" 
                       class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Confirm New Password</label>
                <input id="confirmPassword" type="password" placeholder="••••••••" 
                       class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button id="resetBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition-all shadow-lg mt-4">
                Reset Password
            </button>

            <p id="statusMsg" class="text-center text-sm font-medium mt-4 hidden"></p>
            
            <div class="text-center mt-6">
            <a href="index.html" class="text-blue-600 hover:underline text-sm">Back to Login</a>            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        // import { db, auth } from "./firebase-config.js";
        import { getFirestore, collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, verifyPasswordResetCode, confirmPasswordReset, updatePassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 1. Your Firebase Config (Copy-paste the same one from your Dashboard)
        const firebaseConfig = {
            apiKey: "AIzaSyAlpEfar5odDfV9c2bbmaIpAt5fJJfbez4",
            authDomain: "software-peer-support.firebaseapp.com",
            projectId: "software-peer-support",
            storageBucket: "software-peer-support.firebasestorage.app",
            messagingSenderId: "43088815786",
            appId: "1:43088815786:web:4332760b0fef1b7ae152d3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 2. Get the 'oobCode' from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');

        const statusMsg = document.getElementById("statusMsg");
        const resetBtn = document.getElementById("resetBtn");

        resetBtn.onclick = async () => {

            resetBtn.disabled = true;
            resetBtn.innerText = "Processing...";

            const userOtp = document.getElementById("otpInput").value;
            const newPass = document.getElementById("newPassword").value;
            const confirmPass = document.getElementById("confirmPassword").value;
            const myUid = localStorage.getItem("uid") || sessionStorage.getItem("uid");

            // Basic Validation
            if (userOtp.length < 6 || isNaN(userOtp)) {
                showStatus("❌ Please enter a valid 6-digit OTP.", "text-red-600");
                return;
            }
            if (newPass.length < 6) {
                showStatus("❌ Password must be at least 6 characters.", "text-red-600");
                return;
            }
        // Simple Validation
        if (newPass !== confirmPass) {
            alert("Passwords do not match!");
            resetBtn.disabled = false;
            resetBtn.innerText = "Reset Password";
            return;
        }

            try {
            // 2. The No-Index Query: Get all notifications for the user
            const q = query(
                collection(db, "notifications"), 
                where("to", "==", myUid)
            );

            const querySnapshot = await getDocs(q);
            
            // 3. Find the latest security OTP in the results
            let latestNotif = null;
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.type === "security") {
                    if (!latestNotif || data.timestamp?.toMillis() > latestNotif.timestamp?.toMillis()) {
                        latestNotif = data;
                    }
                }
            });

            if (!latestNotif) {
                alert("No security code found. Please request a new one.");
                return;
            }

            // 4. Verify OTP and Expiry
            const now = new Date();
            const expiry = latestNotif.expires.toDate();

            if (userOtp !== latestNotif.otp) {
                alert("❌ Incorrect OTP code.");
            } else if (now > expiry) {
                alert("❌ This OTP has expired (5 minute limit).");
            } else {
                // 5. Check if user is logged in and update
                if (auth.currentUser) {
                    await updatePassword(auth.currentUser, newPass);

                    // Determine where to send them based on their role
                    const userRole = localStorage.getItem("role"); // e.g., "admin", "counsellor"
                    let redirectPage = "mainpage.html"; // Default for students

                    if (userRole === "admin") redirectPage = "mainpage.html";
                    else if (userRole === "counsellor") redirectPage = "mainpage.html";
                    else if (userRole === "moderator") redirectPage = "mainpage.html";
                    
                    // Success UI
// Success UI
        document.querySelector(".max-w-md").innerHTML = `
            <div class="text-center p-6">
                <div class="text-5xl mb-4">🎉</div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Success!</h2>
                <p class="text-gray-600 mb-6">Your password has been updated.</p>
                <button onclick="window.location.href='mainpage.html'" 
                    class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">
                    Back to Mainpage
                </button>
            </div>`;
                } else {
                    alert("Session expired. Please log in again.");
                    window.location.href = "index.html";
                }
            }
        } catch (error) {
    console.error("Error:", error);
    
    if (error.code === 'auth/requires-recent-login') {
        alert("🔒 For security, you must log in again before changing your password.");
        // Change 'index.html' to your actual login page name
        window.location.href = "index.html"; 
    } else {
        alert("System Error: " + error.message);
    }
} finally {
            resetBtn.disabled = false;
            resetBtn.innerText = "Reset Password";
        }
    };
