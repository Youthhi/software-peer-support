<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Submission</title>
    <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="style.css">
  <script src="theme.js" defer></script>
</head>

<style>
    /* Targeting the specific ID or the class */
    #postContainer.custom-scrollbar::-webkit-scrollbar {
        width: 8px;
    }

    #postContainer.custom-scrollbar::-webkit-scrollbar-track {
        background: #f8fafc;
        border-radius: 10px;
        margin: 10px; /* Keeps the thumb away from the rounded corners */
    }

    #postContainer.custom-scrollbar::-webkit-scrollbar-thumb {
        background: #6366f1;
        border-radius: 10px;
        border: 2px solid #ffffff; /* Gives it a "floating" look */
    }

    #postContainer.custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #4338ca;
    }

    /* Keeps the layout stable when the scrollbar appears */
    #postContainer {
        scrollbar-gutter: stable;
        scroll-behavior: smooth;
    }
</style>

<body class="bg-gray-100 p-6 font-sans">
    <div class="max-w-3xl mx-auto">
        <button onclick="window.history.back()"
            class="mb-6 flex items-center gap-2 text-indigo-600 font-bold hover:text-indigo-800 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                    clip-rule="evenodd" />
            </svg>
            Back to Dashboard
        </button>

        <div id="postContainer"
            class="bg-white p-10 rounded-3xl shadow-xl border border-gray-200 min-h-[400px] max-h-[70vh] overflow-y-auto custom-scrollbar">

            <div class="flex justify-center items-center h-full py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                <p class="ml-4 text-gray-500 font-medium">Loading submission details...</p>
            </div>
        </div>

        <div id="actionArea" class="mt-8 flex gap-4 hidden">
            <button id="rejectBtn"
                class="flex-1 bg-red-100 text-red-700 py-4 rounded-2xl font-bold hover:bg-red-200 transition-all active:scale-95">
                Reject & Delete
            </button>
            <button id="approveBtn"
                class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all active:scale-95">
                Approve & Publish
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Config (Using your project credentials)
        const firebaseConfig = {
            apiKey: "AIzaSyAlpEfar5odDfV9c2bbmaIpAt5fJJfbez4",
            authDomain: "software-peer-support.firebaseapp.com",
            projectId: "software-peer-support",
            storageBucket: "software-peer-support.firebasestorage.app",
            messagingSenderId: "43088815786",
            appId: "1:43088815786:web:4332760b0fef1b7ae152d3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Get ID from URL and User Role from Storage
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const role = sessionStorage.getItem("role") || localStorage.getItem("role");

        async function loadFullPost() {
            if (!postId) {
                alert("No post selected.");
                window.location.href = "dashboard.html";
                return;
            }

            try {
                const snap = await getDoc(doc(db, "posts", postId));

                if (snap.exists()) {
                    const p = snap.data();
                    // Inject Content with Vertical Scroll Logic
                    document.getElementById("postContainer").innerHTML = `
    <div class="mb-2">
        <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2.5 py-0.5 rounded uppercase tracking-wider">Pending Review</span>
    </div>
    <h1 class="text-4xl font-extrabold text-gray-900 mb-4 leading-tight">${p.title}</h1>
    
    <div class="flex items-center gap-3 mb-6">
        <div class="h-10 w-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold">
            ${p.authorName.charAt(0)}
        </div>
        <div>
            <p class="text-sm font-bold text-gray-800">${p.authorName}</p>
            <p class="text-xs text-gray-500 uppercase tracking-tighter">${p.authorRole}</p>
        </div>
    </div>

    <div class="border-t border-gray-100 pt-6">
        <div class="max-h-[450px] overflow-y-auto overflow-x-hidden pr-4 custom-scrollbar">
            <div class="text-gray-700 text-lg leading-relaxed whitespace-pre-wrap break-words italic">
                "${p.content}"
            </div>
        </div>
    </div>
`;
                    // Only show buttons if user is Admin/Moderator AND post is still pending
                    if ((role === 'admin' || role === 'moderator') && p.status === 'pending') {
                        document.getElementById("actionArea").classList.remove("hidden");
                    }
                } else {
                    document.getElementById("postContainer").innerHTML = `<p class="text-center text-red-500 mt-20 font-bold">Post not found or has been removed.</p>`;
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("postContainer").innerHTML = `<p class="text-center text-red-500 mt-20 font-bold">Failed to load content.</p>`;
            }
        }

        // Action Logic (Approved or Rejected)
        window.handleAction = async (action) => {
            const postRef = doc(db, "posts", postId);
            try {
                if (action === 'approve') {
                    await updateDoc(postRef, {
                        status: "approved",
                        approvedAt: serverTimestamp()
                    });
                    alert("Post approved! It is now live on the forum.");
                } else {
                    if (confirm("Are you sure you want to reject and delete this post?")) {
                        await deleteDoc(postRef);
                        alert("Submission deleted.");
                    } else return;
                }
                // REDIRECT: Go back to your dashboard (where the list section lives)
                window.location.href = "moderatoraccount.html";
            } catch (err) {
                alert("Transaction failed. Check permissions.");
            }
        };

        // Attach Event Listeners
        document.getElementById("approveBtn").onclick = () => handleAction('approve');
        document.getElementById("rejectBtn").onclick = () => handleAction('reject');

        loadFullPost();
    </script>
</body>

</html>
